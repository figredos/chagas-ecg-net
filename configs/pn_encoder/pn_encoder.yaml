data:
  train_size: 0.8
  test_size: 0.2
  class_names: ["Chagas", "non-Chagas"]
  use_pre_split: False
  complete_dataset_path: datasets/samitrop_ptbxl_equalized_balanced.pt
  split_train_dataset_path: ""
  split_test_dataset_path: ""

  # Dataset specific  
  wavelet: bior3.3
  level: 1
  window_augment: True
  window_size: 200
  stride: 100
  filter: 0.5

training:
  epochs: 100
  lr: 1e-3
  plateau_patience: 5
  es_patience: 15
  min_delta: 0
  scheduler_factor: 0.5
  scheduler_patience: 10

model:  
  batch_size: 128
  embed_dim: 128
  num_layers: 6
  num_heads: 8
  num_leads: 12
  num_classes: 2
  dropout: 0.1
  ff_multiplier: 4

paths:
  checkpoints_dir: checkpoints/pn_encoder
  save_filename: pn_encoder_artifact

mlflow:
  experiment_name: pn_encoder_ecg
  run_name: null
  tracking_uri: sqlite:///mlflow.db
  version: null

notebook: False
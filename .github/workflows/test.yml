name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Create .env
        run: |
          cat > .env << EOF
          REGISTRY_ROOT=model_registry
          PRIMARY_MODEL_NAME=grouped_lead_cnn
          PRIMARY_MODEL_VERSION=latest
          SECONDARY_MODEL_NAME=cnn_bert
          SECONDARY_MODEL_VERSION=latest
          SECONDARY_MODEL_RATIO=0.1
          EOF
      - run: pytest tests/ -v
